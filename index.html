<style>
:root{--bg:#fff3d1;--fg:#2b2350;--card:#fff;--bar:#e6defc;--a:#ff7a59;--b:#2f9fe8;--c:#3dbb5c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a3a;--fg:#fff4d6;--card:#2c2860;--bar:#3a3480}}
:root[data-theme="dark"]{--bg:#1d1a3a;--fg:#fff4d6;--card:#2c2860;--bar:#3a3480}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden;text-align:center}
[hidden]{display:none!important}
#home{padding:20px;max-width:650px;margin:0 auto;display:flex;flex-direction:column;justify-content:center;height:100%;box-sizing:border-box}
h1{font-size:36px;margin:10px 0}
.row{display:flex;gap:12px;justify-content:center;margin:12px 0}
button{font:inherit;border:0;border-radius:24px;padding:16px 22px;font-size:22px;background:var(--card);color:var(--fg);box-shadow:0 4px 0 rgba(0,0,0,.15);cursor:pointer;transition:transform .1s;position:relative;z-index:150}
button:active{transform:scale(0.96)}
.age button{flex:1}
.age button.on{background:var(--b);color:#fff}
.g{display:block;width:100%;margin:12px 0;font-size:26px;padding:22px;color:#fff;border-radius:28px}
.g small{display:block;font-size:16px;opacity:.9;margin-top:6px}
#err{color:#d93025;min-height:24px;font-size:16px;font-weight:bold}
#game{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding-bottom:10px;box-sizing:border-box}
#top{display:flex;width:100%;justify-content:space-between;align-items:center;padding:10px 16px;box-sizing:border-box;z-index:150}
#top button{padding:10px 18px;font-size:20px}
#st{font-size:32px;font-weight:800;color:#ffb300;text-shadow:0 2px 0 #0002}
#pr{font-size:clamp(26px, 6vw, 48px);font-weight:800;min-height:1.2em;padding:0 12px;z-index:5}

#an{font-size:min(52vh, 75vw);line-height:1;flex:1;display:flex;align-items:center;justify-content:center;transition:transform .1s;z-index:1}
#an.cbox{flex:none;width:min(50vh, 80vw);height:min(50vh, 80vw);margin:12px 0;border-radius:50px;justify-content:center;font-size:min(20vh, 35vw);box-shadow:0 10px 0 rgba(0,0,0,.2);border:10px solid var(--card);box-sizing:border-box}

#bx{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;min-height:0;z-index:1}
#bx svg{height:min(52vh, 82vw);width:auto}
#ar{font-size:12vh;line-height:1;margin-bottom:-10px}

.bar{width:85%;max-width:600px;height:26px;background:var(--bar);border-radius:14px;overflow:hidden;margin:4px 0;border:2px solid rgba(0,0,0,0.05)}
.bar i{display:block;height:100%;width:0;background:var(--c);transition:width .1s}
#pg i{background:var(--a)}
.lb{font-size:15px;opacity:.85;font-weight:bold;margin-top:2px}

#v{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(320px, 42vw);height:min(240px, 32vw);object-fit:cover;border-radius:24px;border:5px solid #fff;box-shadow:0 10px 25px rgba(0,0,0,0.3);transform:scaleX(-1);background:#000;z-index:100;pointer-events:none}

#cheer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:14vw;font-weight:900;color:#ffb300;text-shadow:0 6px 0 #0004;pointer-events:none;opacity:0;transform:scale(.4);transition:.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);z-index:200}
#cheer.on{opacity:1;transform:scale(1)}
</style>
</head>

  <button class="g" style="background:var(--c)" onclick="start('color')">🎨 ابحث عن اللون (مستمر)<small>تحديات الألوان لفترة طويلة</small></button>

const DAN=['🐻','🦁','🐼','🐵','🐶','🦄','🐯','🐸'];
const OK=['أحسنت يا بطل','برافو عليك','ممتاز جداً','رائع يا شاطر','عمل ممتاز'];

function setAge(a){age=a;$('a3').className=a==3?'on':'';$('a5').className=a==5?'on':''}

function say(t,cancel){
  try{
    if(!window.speechSynthesis)return;
    if(cancel)speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang='ar-SA';
    const vs=speechSynthesis.getVoices().filter(x=>x.lang.replace('_','-').toLowerCase().startsWith('ar'));
    u.voice=vs.find(x=>/laila|zeina|mariam|sara|salma|zayd|female|woman|child/i.test(x.name))||vs[0]||null;
    u.pitch=1.65;
    u.rate=0.88;
    speechSynthesis.speak(u);
  }catch(e){}
}

function beep(f,d){
  if(!ac)return;
  try{
    const o=ac.createOscillator(),g=ac.createGain();
    o.frequency.value=f;
    o.type='triangle';
    g.gain.value=.2;
    o.connect(g);
    g.connect(ac.destination);
    o.start();
    o.stop(ac.currentTime+(d||.15));
  }catch(e){}
}

function playMusicStep(){
  if(!run||game!='dance'||!ac)return;
  const notes=[261.63, 329.63, 392.00, 523.25, 440.00, 349.23];
  const freq=notes[musicStep%notes.length];
  musicStep++;
  try{
    const o=ac.createOscillator(),g=ac.createGain();
    o.frequency.value=freq;
    o.type='sine';
    g.gain.setValueAtTime(0.08, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+0.25);
    o.connect(g);
    g.connect(ac.destination);
    o.start();
    o.stop(ac.currentTime+0.25);
  }catch(e){}
}

function startMusic(){
  stopMusic();
  musicStep=0;
  musicTimer=setInterval(playMusicStep, 320);
}

function stopMusic(){
  if(musicTimer){clearInterval(musicTimer);musicTimer=null;}
}

function banner(t){
  const c=$('cheer');c.textContent=t;c.classList.add('on');
  setTimeout(()=>c.classList.remove('on'),1100);
}
