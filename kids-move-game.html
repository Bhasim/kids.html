<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>العب وتحرّك</title>
<style>
:root{--bg:#fff3d1;--fg:#2b2350;--card:#fff;--bar:#e6defc;--a:#ff7a59;--b:#2f9fe8;--c:#3dbb5c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a3a;--fg:#fff4d6;--card:#2c2860;--bar:#3a3480}}
:root[data-theme="dark"]{--bg:#1d1a3a;--fg:#fff4d6;--card:#2c2860;--bar:#3a3480}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden;text-align:center}
[hidden]{display:none!important}
#home{padding:14px;max-width:560px;margin:0 auto}
h1{font-size:30px;margin:8px 0}
.row{display:flex;gap:10px;justify-content:center;margin:10px 0}
button{font:inherit;border:0;border-radius:22px;padding:14px 18px;font-size:20px;background:var(--card);color:var(--fg);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.age button{flex:1}
.age button.on{background:var(--b);color:#fff}
.g{display:block;width:100%;margin:10px 0;font-size:24px;padding:18px;color:#fff}
.g small{display:block;font-size:14px;opacity:.9;margin-top:4px}
#err{color:#d93025;min-height:20px;font-size:15px}
#game{height:100%;display:flex;flex-direction:column;align-items:center}
#top{display:flex;width:100%;justify-content:space-between;align-items:center;padding:8px 12px;box-sizing:border-box}
#top button{padding:8px 14px;font-size:18px}
#st{font-size:26px;font-weight:700}
#pr{font-size:clamp(22px,5vw,40px);font-weight:700;min-height:1.3em;padding:0 10px}
#an{font-size:min(36vh,58vw);line-height:1.1;flex:1;display:flex;align-items:center;transition:transform .1s}
#chip{width:44px;height:44px;border-radius:50%;border:4px solid var(--card);margin:4px}
.bar{width:80%;max-width:520px;height:22px;background:var(--bar);border-radius:12px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;width:0;background:var(--c);transition:width .1s}
#pg i{background:var(--a)}
.lb{font-size:14px;opacity:.8}
#v{position:fixed;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));width:110px;height:82px;object-fit:cover;border-radius:14px;border:3px solid var(--card);transform:scaleX(-1);background:#000}
#cheer{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:12vw;font-weight:800;color:#ffb300;text-shadow:0 4px 0 #0003;pointer-events:none;opacity:0;transform:scale(.5);transition:.25s}
#cheer.on{opacity:1;transform:scale(1)}
</style>
</head>
<body>
<section id="home">
  <h1>🐾 العب وتحرّك</h1>
  <div class="row age"><button id="a3" class="on" onclick="setAge(3)">👶 عمر ٣ سنوات</button><button id="a5" onclick="setAge(5)">🧒 عمر ٥ سنوات</button></div>
  <button class="g" style="background:var(--a)" onclick="start('dance')">💃 ارقص مع الحيوانات<small>الكاميرا تقيس حركتك وتعطيك نجومًا</small></button>
  <button class="g" style="background:var(--b)" onclick="start('move')">🐒 قلّد الحركة<small>ارفع يديك، تمايل، اقفز</small></button>
  <button class="g" style="background:var(--c)" onclick="start('color')">🎨 ابحث عن اللون<small>هات شيئًا بلون الحيوان وأرِه للكاميرا</small></button>
  <div id="err"></div>
  <p class="lb">ضع الهاتف أمام الأطفال على حامل، بمسافة ٢ إلى ٣ أمتار. الصورة لا تُرسل لأي مكان.</p>
</section>
<section id="game" hidden>
  <div id="top"><button onclick="home()">⬅️ رجوع</button><span id="st">⭐ 0</span><button onclick="flip()">🔄</button></div>
  <div id="pr"></div>
  <div id="chip" hidden></div>
  <div id="an">🐻</div>
  <div class="lb">مقياس الحركة</div><div class="bar" id="mt"><i></i></div>
  <div class="lb">النجمة القادمة</div><div class="bar" id="pg"><i></i></div>
</section>
<video id="v" playsinline muted autoplay hidden></video>
<div id="cheer"></div>
<script>
const $=i=>document.getElementById(i);
let age=3,game='',stars=0,stream=null,facing='user',ac=null,run=false,last=0,prev=null,sm=0,prog=0,hold=0,mv=null,col=null,mvT=0;
const v=$('v'),cv=document.createElement('canvas');cv.width=48;cv.height=36;
const cx=cv.getContext('2d',{willReadFrequently:true});
const COL=[['أحمر','🐞',h=>h<14||h>346,'#e53935'],['أصفر','🐥',h=>h>44&&h<68,'#fdd835'],['أخضر','🐸',h=>h>85&&h<160,'#43a047'],['أزرق','🐳',h=>h>195&&h<250,'#1e88e5'],['برتقالي','🦊',h=>h>=18&&h<=38,'#fb8c00']];
const MOV=[['ارفع يديك عاليًا!','🐒','top'],['انزل للأسفل مثل الضفدع!','🐸','bot'],['تمايل ناحية اليسار ⬅️','🐘','left'],['تمايل ناحية اليمين ➡️','🦒','right'],['اقفز مثل الأرنب!','🐰','all']];
const DAN=['🐻','🦁','🐼','🐵','🐶','🦄','🐯','🐸'];
function setAge(a){age=a;$('a3').className=a==3?'on':'';$('a5').className=a==5?'on':''}
function beep(f,d){if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.type='triangle';g.gain.value=.15;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+(d||.15))}
function win(){stars++;$('st').textContent='⭐ '+stars;[660,880,1175].forEach((f,i)=>setTimeout(()=>beep(f),i*110));const c=$('cheer');c.textContent=['أحسنت! 🌟','برافو! 🎉','رائع! 👏'][stars%3];c.classList.add('on');setTimeout(()=>c.classList.remove('on'),900)}
async function cam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:320},height:{ideal:240}},audio:false});v.srcObject=stream;v.hidden=false;await v.play();prev=null}
async function start(g){game=g;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();await cam()}catch(e){$('err').textContent='لم تفتح الكاميرا. اسمح بالكاميرا لموقع Safari، وافتح الصفحة عبر رابط https.';return}
$('home').hidden=true;$('game').hidden=false;stars=0;$('st').textContent='⭐ 0';prog=0;run=true;next();requestAnimationFrame(loop)}
function home(){run=false;$('game').hidden=true;$('home').hidden=false;v.hidden=true;if(stream)stream.getTracks().forEach(t=>t.stop())}
async function flip(){facing=facing=='user'?'environment':'user';try{await cam()}catch(e){}}
function next(){hold=0;mvT=Date.now();$('chip').hidden=true;
if(game=='dance'){$('pr').textContent='ارقص مع الحيوان! 💃';$('an').textContent=DAN[stars%DAN.length]}
else if(game=='move'){const p=age==3?[0,2,3,4]:[0,1,2,3,4];mv=MOV[p[Math.random()*p.length|0]];$('pr').textContent=mv[0];$('an').textContent=mv[1]}
else{col=COL[Math.random()*COL.length|0];$('pr').textContent='هات شيئًا '+col[0]+' وأرِه للكاميرا!';$('an').textContent=col[1];$('chip').style.background=col[3];$('chip').hidden=false}}
function match(r,g,b){const m=Math.max(r,g,b),n=Math.min(r,g,b),d=m-n;if(m<90||d/m<.5)return false;const h=m==r?((g-b)/d+6)%6:m==g?(b-r)/d+2:(r-g)/d+4;return col[2](h*60)}
function loop(t){if(!run)return;requestAnimationFrame(loop);if(t-last<100||v.readyState<2)return;last=t;
cx.save();cx.translate(48,0);cx.scale(-1,1);cx.drawImage(v,0,0,48,36);cx.restore();
const d=cx.getImageData(0,0,48,36).data,n=1728;let a=0,tp=0,bt=0,l=0,r=0,cc=0;
for(let i=0;i<n;i++){const o=i*4,x=i%48,y=i/48|0;
if(prev&&Math.abs(d[o]+d[o+1]+d[o+2]-prev[o]-prev[o+1]-prev[o+2])>90){a++;if(y<14)tp++;if(y>21)bt++;if(x<24)l++;else r++}
if(game=='color'&&x>8&&x<40&&y>6&&y<30&&match(d[o],d[o+1],d[o+2]))cc++}
prev=d;sm=sm*.6+(a/n)*.4;const lv=Math.min(1,sm/.2);
$('mt').firstChild.style.width=(lv*100)+'%';
$('an').style.transform='rotate('+(Math.sin(t/140)*(4+lv*22))+'deg) scale('+(1+lv*.25)+')';
if(game=='dance'){if(sm>(age==3?.03:.06))prog+=lv;const need=age==3?20:30;$('pg').firstChild.style.width=Math.min(100,prog/need*100)+'%';if(prog>=need){prog=0;win();next()}}
else if(game=='move'){const k=mv[2],f=k=='top'?tp/672:k=='bot'?bt/672:k=='left'?l/864:k=='right'?r/864:a/n;
if(f>(age==3?.08:.12))hold++;else hold=Math.max(0,hold-1);
$('pg').firstChild.style.width=Math.min(100,hold/(age==3?8:6)*100)+'%';
if(hold>=(age==3?8:6)){win();next()}else if(Date.now()-mvT>(age==3?12000:9000))next()}
else{if(cc/672>.07)hold++;else hold=0;$('pg').firstChild.style.width=Math.min(100,hold/8*100)+'%';
if(hold>=8){win();next()}else if(Date.now()-mvT>20000)next()}}
</script>
</body>
</html>
